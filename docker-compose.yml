services:
    # -------------------------------------------------------
    # APP - PHP 8.4 FPM
    # -------------------------------------------------------
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: harus_app
        volumes:
            - .:/var/www/html
        depends_on:
            - mysql
            - redis
        networks:
            - harus_network

    # -------------------------------------------------------
    # NGINX - servidor web
    # -------------------------------------------------------
    nginx:
        image: nginx:alpine
        container_name: harus_nginx
        ports:
            - "80:80"
        volumes:
            - .:/var/www/html
            - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - app
        networks:
            - harus_network

    # -------------------------------------------------------
    # MYSQL 8.0
    # -------------------------------------------------------
    mysql:
        image: mysql:8.0
        container_name: harus_mysql
        ports:
            - "3306:3306"
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: harusdesk
            MYSQL_USER: harusdesk
            MYSQL_PASSWORD: harusdesk
        volumes:
            - harus_mysql_data:/var/lib/mysql
        networks:
            - harus_network

    # -------------------------------------------------------
    # REDIS - cache e filas
    # -------------------------------------------------------
    redis:
        image: redis:alpine
        container_name: harus_redis
        ports:
            - "6379:6379"
        volumes:
            - harus_redis_data:/data
        networks:
            - harus_network

    # -------------------------------------------------------
    # QUEUE WORKER - processa filas em background
    # -------------------------------------------------------
    # queue:
    #   build:
    #     context: .
    #     dockerfile: Dockerfile
    #   container_name: harus_queue
    #   command: php artisan queue:work redis --tries=3 --timeout=90
    #   volumes:
    #     - .:/var/www/html
    #   depends_on:
    #     - mysql
    #     - redis
    #   networks:
    #     - harus_network

    # -------------------------------------------------------
    # PHPMYADMIN - interface web pro banco de dados
    # -------------------------------------------------------
    phpmyadmin:
        image: phpmyadmin/phpmyadmin
        container_name: harus_phpmyadmin
        ports:
            - "8080:80"
        environment:
            PMA_HOST: mysql
            PMA_PORT: 3306
            MYSQL_ROOT_PASSWORD: root
        depends_on:
            - mysql
        networks:
            - harus_network

# -------------------------------------------------------
# VOLUMES
# -------------------------------------------------------
volumes:
    harus_mysql_data:
    harus_redis_data:

# -------------------------------------------------------
# NETWORKS
# -------------------------------------------------------
networks:
    harus_network:
        driver: bridge
