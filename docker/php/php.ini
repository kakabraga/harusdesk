[PHP]
; Timezone do Brasil
date.timezone = America/Sao_Paulo

; Tamanho máximo de upload de arquivos
; ajuste conforme necessidade do sistema de anexos
upload_max_filesize = 20M
post_max_size = 25M

; Memória máxima por requisição
memory_limit = 256M

; Tempo máximo de execução de um script (segundos)
max_execution_time = 60

; Exibe erros no desenvolvimento (mude pra Off em produção)
display_errors = On
error_reporting = E_ALL

[opcache]
; Ativa o opcache
opcache.enable = 1
; Número de scripts em cache
opcache.max_accelerated_files = 10000
; Intervalo de revalidação em segundos (0 = sempre revalida, bom pra dev)
opcache.revalidate_freq = 0
