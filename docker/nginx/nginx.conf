server {
    # porta que o Nginx vai escutar dentro do container
    # o docker-compose vai mapear isso pra porta 80 do host
    listen 80;

    # diretório raiz da aplicação
    # no Laravel o entry point é sempre o public/index.php
    root /var/www/html/public;

    # arquivo padrão ao acessar um diretório
    index index.php;

    # nome do servidor (localhost no desenvolvimento)
    server_name localhost;

    # tamanho máximo do body da requisição
    # tem que bater com o post_max_size do php.ini
    client_max_body_size 25M;

    location / {
        # tenta servir o arquivo diretamente
        # se não achar, tenta como diretório
        # se não achar, passa pro index.php (necessário pro roteamento do Laravel)
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        # passa a requisição PHP pro PHP-FPM
        # "app" é o nome do serviço no docker-compose
        # 9000 é a porta que o PHP-FPM escuta
        fastcgi_pass app:9000;
        fastcgi_index index.php;

        # inclui parâmetros padrão do FastCGI
        include fastcgi_params;

        # passa o caminho do script pro PHP-FPM
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
    }

    # bloqueia acesso a arquivos ocultos (.env, .git etc)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
